name: Release and deploy to WordPress.org

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  deploy:
    name: Release and deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    environment: wordpress-org
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read and validate release version
        id: version
        run: |
          version="$(sed -n 's/^Version: //p' woonuxt.php)"
          test -n "$version"
          grep -Fx "Stable tag: $version" readme.txt
          grep -Fqx "define('WOONUXT_SETTINGS_VERSION', '$version');" includes/constants.php
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release when this version is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$VERSION" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "$VERSION" \
            --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Check whether WordPress.org needs this version
        id: wordpress
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          directory_version="$(curl --fail --silent --show-error \
            'https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request%5Bslug%5D=settings-for-woonuxt' \
            | jq -r '.version')"
          test -n "$directory_version"
          if [ "$directory_version" = "$VERSION" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n%s\n' "$directory_version" "$VERSION" | sort -V | tail -n1)" = "$VERSION" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Refusing to deploy $VERSION because WordPress.org already has newer version $directory_version" >&2
            exit 1
          fi

      - name: Deploy plugin
        if: steps.wordpress.outputs.deploy == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: settings-for-woonuxt
          VERSION: ${{ steps.version.outputs.value }}
